/* ---------------- Render and navigation ---------------- */
function setHdr() { document.documentElement.style.setProperty("--hdr", header.offsetHeight + "px"); }
if ("ResizeObserver" in window) new ResizeObserver(setHdr).observe(header); else window.addEventListener("resize", setHdr);

function renderChrome() {
  const p = document.getElementById("progress");
  if (V.name === "setup") {
    const cur = setupStage(V.step) + 1;
    p.hidden = false;
    p.innerHTML = SETUP_STEPS.map((s, i) => {
      const n = i + 1, cls = n < cur ? "is-done" : n === cur ? "is-current" : "";
      return `<li class="${cls}"${n === cur ? ' aria-current="step"' : ""}><span class="bar" aria-hidden="true"></span><span class="lbl">${s}</span></li>`;
    }).join("");
  } else { p.hidden = true; p.innerHTML = ""; }
  const inApp = !!S.setup && ["home", "day", "week", "results", "settings"].includes(V.name);
  tabbar.hidden = !inApp;
  tabbar.querySelectorAll(".tab").forEach(t => {
    const on = t.dataset.to === V.name || (V.name === "day" && t.dataset.to === "home") || (V.name === "week" && t.dataset.to === (V.from || "results"));
    if (on) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current");
  });
  document.body.classList.toggle("pad-bottom", inApp || V.name === "log");
  setHdr();
}
function viewOpening() {
  return `<section><h1 tabindex="-1">Opening your challenge…</h1><p class="lede">This takes a few seconds.</p></section>`;
}
const VIEWS = { opening: viewOpening, welcome: viewWelcome, setup: viewSetup, home: viewHome, day: viewDay, week: viewWeek, log: viewLog, results: viewResults, settings: viewSettings };
function render() {
  if (S.setup) {
    let changed = false;
    if (V.name === "week" && weekReady(V.w) && !S.seen["w" + V.w]) { S.seen["w" + V.w] = true; changed = true; }
    if (V.name === "results" && monthReady() && !S.seen.month) { S.seen.month = true; changed = true; }
    if (changed) save();
  }
  renderChrome();
  main.innerHTML = VIEWS[V.name]();
}
function go(v) {
  if (v) V = v;
  render();
  window.scrollTo(0, 0);
  const h = main.querySelector("h1");
  if (h) h.focus({ preventScroll: true });
}
function rerenderKeepScroll() { const y = window.scrollY; render(); window.scrollTo(0, y); }
function showErr(msg) { const e = main.querySelector("#err"); if (e) e.textContent = msg; }
function clearErrs() {
  main.querySelectorAll(".error").forEach(e => (e.textContent = ""));
  main.querySelectorAll(".invalid").forEach(q => q.classList.remove("invalid"));
}
function checkNames(a, b) {
  if (!a || !b) { showErr("Add both names to continue."); main.querySelector(a ? "#n1" : "#n0").focus(); return false; }
  if (a.toLowerCase() === b.toLowerCase()) { showErr("Use two different names so you can tell your entries apart."); main.querySelector("#n1").focus(); return false; }
  return true;
}

function startSetup() {
  draft = { names: ["", ""], emails: [""], people: [{}, {}], country: "", area: null, kids: null, adultCare: null, pets: null, paidHelp: null, paidHelpFreq: null, otherHelp: null, otherHelpLives: null, otherHelpFreq: null, start: "today", guesses: [50, 50] };
  go({ name: "setup", step: 0 });
}
function flagMissing(miss) {
  if (!miss.length) return true;
  miss.forEach(m => main.querySelector("#" + m[0]).classList.add("invalid"));
  showErr("Please answer: " + miss.map(m => m[1]).join(", ") + ".");
  const f = main.querySelector(`#${miss[0][0]} input, #${miss[0][0]} select`);
  if (f) f.focus();
  return false;
}
function setupNext() {
  clearErrs();
  const st = V.step;
  if (st === 0) {
    draft.names = [main.querySelector("#n0").value.trim(), main.querySelector("#n1").value.trim()];
    if (!checkNames(draft.names[0], draft.names[1])) return;
    if (LINKS) {
      draft.emails = [main.querySelector("#e0").value.trim()];
      if (!EMAIL_RE.test(draft.emails[0])) { showErr(draft.emails[0] ? "Check the email address. It doesn’t look complete." : "Add an email to continue."); main.querySelector("#e0").focus(); return; }
    }
  } else if (st === 1 || st === 2) {
    const p = st - 1;
    if (!flagMissing(CONFIG.personFields.filter(f => !draft.people[p][f.id]).map(f => [`q-${f.id}-${p}`, f.question.toLowerCase()]))) return;
  } else if (st === 3) {
    const miss = [];
    if (!draft.country) miss.push(["q-country", "country"]);
    if (!draft.area) miss.push(["q-area", "kind of place"]);
    if (draft.kids === null) miss.push(["q-kids", "children"]);
    if (draft.adultCare === null) miss.push(["q-adult", "caring for an adult"]);
    if (draft.pets === null) miss.push(["q-pets", "pets"]);
    if (!flagMissing(miss)) return;
  } else if (st === 4) {
    const miss = [];
    if (draft.paidHelp === null) miss.push(["q-paidHelp", "paid help"]);
    else if (draft.paidHelp.length && !draft.paidHelpFreq) miss.push(["q-paidHelpFreq", "how often paid help comes"]);
    if (draft.otherHelp === null) miss.push(["q-otherHelp", "help from other adults"]);
    else if (draft.otherHelp.length) {
      if (!draft.otherHelpLives) miss.push(["q-otherHelpLives", "whether they live with you"]);
      if (!draft.otherHelpFreq) miss.push(["q-otherHelpFreq", "how often they help"]);
    }
    if (!flagMissing(miss)) return;
  } else if (st === 5) {
    if (CONFIG.collectUrl && !draft.consent) { flagMissing([["q-consent", "sharing your answers (tick the box to take part)"]]); return; }
  } else if (st === 8) {
    const start = draft.start === "tomorrow" ? addDays(todayISO(), 1) : todayISO();
    S = { v: 1, hid: CONFIG.collectUrl ? newCode() : null, entries: {}, seen: {}, setup: {
      names: draft.names, emails: LINKS ? draft.emails : undefined, people: draft.people, country: draft.country, area: draft.area,
      kids: draft.kids, adultCare: draft.adultCare, pets: draft.pets,
      paidHelp: draft.paidHelp, paidHelpFreq: draft.paidHelpFreq, otherHelp: draft.otherHelp, otherHelpLives: draft.otherHelpLives, otherHelpFreq: draft.otherHelpFreq,
      startDate: start, guesses: draft.guesses, guessesRevealed: false, consent: !!draft.consent, createdAt: new Date().toISOString()
    } };
    save(); draft = null;
    go({ name: "home", started: true });
    return;
  }
  V.step = st + 1;
  go();
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const a = b.dataset.act;
  switch (a) {
    case "setup": startSetup(); break;
    case "setup-back":
      if (V.step === 0) go({ name: "welcome" });
      else { V.step = V.step - 1; go(); }
      break;
    case "setup-next": setupNext(); break;
    case "tab": go({ name: b.dataset.to }); break;
    case "open-day": go({ name: "day", n: Number(b.dataset.n) }); break;
    case "open-week": go({ name: "week", w: Number(b.dataset.w), from: b.dataset.from || "results" }); break;
    case "log": openLog(Number(b.dataset.p), b.dataset.date, b.dataset.from); break;
    case "inc": bump(b.dataset.cat, 1); break;
    case "dec": bump(b.dataset.cat, -1); break;
    case "copy-last": {
      const src = S.entries[b.dataset.from][V.p];
      draft.m = Object.assign({}, src.m); draft.paid = src.paid || 0; dirty = true;
      V.copied = dayNum(b.dataset.from);
      rerenderKeepScroll();
      break;
    }
    case "save-log": saveLog(); break;
    case "cancel-log":
      if (dirty && !b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "Discard my changes"; return; }
      draft = null; dirty = false;
      go(V.from === "day" ? { name: "day", n: dayNum(V.date) } : { name: "home" });
      break;
    case "reveal-guesses": S.setup.guessesRevealed = true; save(); rerenderKeepScroll(); break;
    case "save-names": {
      clearErrs();
      const n0 = main.querySelector("#n0").value.trim(), n1 = main.querySelector("#n1").value.trim();
      if (!checkNames(n0, n1)) return;
      S.setup.names = [n0, n1]; save();
      main.querySelector("#names-ok").textContent = "Names saved.";
      break;
    }
    case "reset":
      if (!b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "Tap again to delete everything"; return; }
      try { localStorage.removeItem(KEY); } catch (err) {}
      S = freshState(); go({ name: "welcome" });
      break;
  }
});

function exclusive(input, soloValue) {
  if (!input.checked) return;
  main.querySelectorAll(`input[name="${input.name}"]`).forEach(i => {
    if (input.value === soloValue ? i !== input : i.value === soloValue) i.checked = false;
  });
}
main.addEventListener("change", e => {
  const t = e.target;
  const q = t.closest(".q");
  if (q && q.classList.contains("invalid")) { q.classList.remove("invalid"); const er = main.querySelector("#err"); if (er) er.textContent = ""; }
  const target = V.name === "setup" ? draft : S.setup;
  const pm = /^([a-z]+)-([01])$/.exec(t.name || "");
  if (pm && CONFIG.personFields.some(f => f.id === pm[1])) {
    target.people[Number(pm[2])][pm[1]] = t.value;
    if (V.name === "settings") save();
    return;
  }
  switch (t.name) {
    case "country": case "area": target[t.name] = t.value; break;
    case "paidHelp": case "otherHelp": {
      exclusive(t, "none");
      const vals = checkedVals(t.name);
      target[t.name] = vals.includes("none") ? [] : vals.length ? vals : (V.name === "setup" ? null : []);
      const has = !!(target[t.name] && target[t.name].length);
      main.querySelector(t.name === "paidHelp" ? "#paid-more" : "#other-more").hidden = !has;
      if (!has) { if (t.name === "paidHelp") target.paidHelpFreq = null; else { target.otherHelpLives = null; target.otherHelpFreq = null; } }
      break;
    }
    case "paidHelpFreq": case "otherHelpLives": case "otherHelpFreq": target[t.name] = t.value; break;
    case "helped": draft.helped = checkedVals("helped"); dirty = true; return;
    case "kids": {
      exclusive(t, "none");
      const vals = checkedVals("kids");
      target.kids = vals.includes("none") ? [] : vals.length ? vals : (V.name === "setup" ? null : []);
      break;
    }
    case "adultCare": case "pets": target[t.name] = t.value === "yes"; break;
    case "start": draft.start = t.value; return;
    case "consent": draft.consent = t.checked; return;
    case "mental": draft.mental = checkedVals("mental"); dirty = true; return;
    case "fair": draft.fair = t.value; dirty = true; return;
    default: return;
  }
  if (V.name === "settings") save();
});
main.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "guess") {
    const p = Number(t.dataset.p), g = Number(t.value);
    draft.guesses[p] = g;
    main.querySelector("#gv").textContent = g + "%";
    main.querySelector("#gsplit i").style.width = (p ? 100 - g : g) + "%";
  } else if (t.id === "note") { draft.note = t.value; dirty = true; }
  else if (V.name === "setup" && (t.id === "n0" || t.id === "n1")) { draft.names[t.id === "n0" ? 0 : 1] = t.value; }
  else if (V.name === "setup" && t.id === "e0") { draft.emails[0] = t.value; }
});

/* ---------------- Start ---------------- */
function linkParams() {
  return new Promise(r => {
    try {
      if (IN_APPS_SCRIPT && google.script.url) { google.script.url.getLocation(l => r((l && l.parameter) || {})); return; }
      r(Object.fromEntries(new URLSearchParams(location.search)));
    } catch (e) { r({}); }
  });
}
function viewStopped() {
  return `<section><h1 tabindex="-1">Reminders turned off</h1>
    <p class="lede">You won’t get any more evening reminders. Your personal link still works whenever you want to log.</p>
    ${S.setup ? `<div class="actions start"><button class="btn primary" data-act="tab" data-to="home">Back to the challenge</button></div>` : ""}</section>`;
}
VIEWS.stopped = viewStopped;
async function boot() {
  const params = LINKS ? await linkParams() : {};
  const code = String(params.c || "").trim().toUpperCase();
  if (CODE_RE.test(code) && params.stop) {
    V = { name: "opening" }; render();
    try { await callServer("stop", code); V = { name: "stopped" }; }
    catch (e) { V = { name: "welcome", offline: true }; }
    go();
    return;
  }
  if (CODE_RE.test(code) && S.hid !== code) {
    V = { name: "opening" }; render();
    try {
      const r = await callServer("getState", code);
      if (r && r.state && r.state.setup) {
        S = normalise(r.state); S.hid = code; S.link = r.link || ""; S.unsent = false;
        store();
        V = { name: "home", restored: true };
      } else V = { name: "welcome", notFound: true };
    } catch (e) { V = S.setup ? { name: "home" } : { name: "welcome", offline: true }; }
    go();
  } else {
    render();
    pullRemote();
  }
  if (S.unsent) setTimeout(sendNow, 2000);
}
boot();
</script>
